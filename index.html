
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tételek - Bent lévő munkák szűrése</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { padding: 10px 15px; margin-bottom: 20px; cursor: pointer; }
        textarea { width: 100%; height: 50px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<h1>Tételek</h1>
<button onclick="toggleFilter()" id="filterButton">Bent lévő munkák megjelenítése</button>

<table id="taskTable">
    <thead>
        <tr id="headerRow"></tr>
    </thead>
    <tbody id="taskBody"></tbody>
</table>

<script>
let filtered = false;

function toggleFilter() {
    const rows = document.querySelectorAll('#taskBody tr');
    filtered = !filtered;

    rows.forEach(row => {
        const kiment = row.children[4]?.textContent.trim();
        if (filtered && kiment !== "") {
            row.classList.add('hidden');
        } else {
            row.classList.remove('hidden');
        }
    });

    document.getElementById('filterButton').textContent = filtered
        ? "Összes munka megjelenítése"
        : "Bent lévő munkák megjelenítése";
}

fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ_smm3bDbvPkU6FAKROqjvYlrufAcSMU-V-m5aQg7SytksFR8xqE4ar0oNAJb4KbrkVLgXvwUoQz7/pub?output=csv")
    .then(response => response.text())
    .then(csv => {
        const rows = csv.split("\n").map(row => row.split(","));
        const headerRow = document.getElementById('headerRow');
        const body = document.getElementById('taskBody');

        headerRow.innerHTML = "";
        rows[0].forEach(cell => {
            const th = document.createElement('th');
            th.textContent = cell;
            headerRow.appendChild(th);
        });

        for (let i = 1; i < rows.length; i++) {
            const tr = document.createElement('tr');
            rows[i].forEach(cell => {
                const td = document.createElement('td');
                td.textContent = cell;
                tr.appendChild(td);
            });
            const textarea = document.createElement('textarea');
            const td = document.createElement('td');
            td.appendChild(textarea);
            tr.appendChild(td);

            body.appendChild(tr);
        }
    })
    .catch(error => {
        console.error("Hiba a CSV betöltése közben:", error);
    });
</script>

</body>
</html>
